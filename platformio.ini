[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
upload_speed = 921600
lib_deps =
    mathertel/OneButton @ ^2.6.1
build_flags =
    -DBOARD_HAS_PSRAM

[env:Two_LED]
build_src_filter = -<*> +<Two_LED.cpp>
build_flags =
    ${env.build_flags}
    -DLED_PIN_1=4
    -DLED_PIN_2=6
    -DLED_ACT=HIGH
    -DBTN_PIN=5
    -DBTN_ACT=LOW

[env:Blink_LED]
build_src_filter = -<*> +<Blink_LED.cpp>
build_flags =
    ${env.build_flags}
    -DLED_PIN=4
    -DLED_ACT=HIGH

[env:Double_Click]
build_src_filter = -<*> +<Double_Click.cpp>
build_flags =
    ${env.build_flags}
    -DLED_PIN=4
    -DLED_ACT=HIGH
    -DBTN_PIN=5
    -DBTN_ACT=LOW